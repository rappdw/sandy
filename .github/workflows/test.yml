name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install required host tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Host properties and harness regression tests
        run: bash test/run-tests.sh --host-only --require-tools --log-dir /tmp/sandy-test-logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-test-logs
          path: /tmp/sandy-test-logs

  macos-contracts:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install host contract dependencies
        run: |
          brew install coreutils jq
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Run contracts on macOS
        run: bash test/run-tests.sh --only harness,contracts --require-tools --log-dir /tmp/sandy-test-logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-contract-logs
          path: /tmp/sandy-test-logs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Verify Docker
        run: docker info

      # Cache the final Docker image as a tarball between runs.
      # Preserve both tags so a cache hit passes production image-existence checks.
      # Cache key is based on the sandy script hash (Dockerfiles are inline).
      - name: Cache Docker image
        id: cache-image
        uses: actions/cache@v6
        with:
          path: |
            /tmp/sandy-images
            ~/.sandy/.base_build_hash
            ~/.sandy/.build_hash
          key: sandy-contract-image-${{ hashFiles('sandy') }}

      - name: Load cached image
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: docker load < /tmp/sandy-images/sandy-claude-code.tar

      - name: Build images
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: ./sandy --build-only

      - name: Save image to cache
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/sandy-images
          docker save sandy-base:latest sandy-claude-code:latest > /tmp/sandy-images/sandy-claude-code.tar

      - name: Run production container contracts
        run: bash test/run-tests.sh --only container --log-dir /tmp/sandy-test-logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-test-logs
          path: /tmp/sandy-test-logs

  # Egress proxy (M2.7) Go unit + loopback tests. Separate job: pure Go, no
  # Docker, so it gives fast feedback in parallel with the image-build job above.
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Track the SAME Go the shipped proxy is built with. The image uses
      # `FROM golang:1.26-trixie` -- a floating tag resolving to the latest
      # 1.26.x -- but `go-version-file: proxy/go.mod` reads the `go 1.26.0`
      # directive LITERALLY and installs 1.26.0 exactly. That divergence made
      # govulncheck scan a toolchain that never ships: it reported 14 reachable
      # stdlib vulnerabilities fixed across 1.26.1-1.26.6 which the shipped
      # binary does not have, while never validating the binary that does ship.
      # A scan of the wrong artifact is worse than no scan -- it reads as
      # coverage. `1.26` here mirrors the image tag, so the advisory findings
      # describe the artifact users actually run.
      #
      # The go.mod directive stays `go 1.26.0`: it is a MINIMUM (the lowest
      # toolchain allowed to build this module), not a pin, and raising it would
      # exclude contributors on an older 1.26.x for no gain.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: proxy/go.sum

      - name: gofmt
        working-directory: proxy
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: proxy
        run: go vet ./...

      - name: go test -race
        working-directory: proxy
        run: go test -race ./...

      # HF-incident Issue 1: the proxy parses attacker-influenced wire bytes, so
      # prove the parsers never panic under adversarial input — a short fuzz pass
      # per target (seed corpus + fuzzing). Any crasher fails the build.
      #
      # Budget is ITERATIONS (1000000x), not wall-clock. A duration budget makes
      # the fuzzing coordinator derive a context deadline from it, and when that
      # deadline fires while workers are still finishing, `go test` reports
      # "--- FAIL: <target> ... context deadline exceeded" with NO crasher found
      # and nothing written to testdata/ — a pure shutdown artifact that reds the
      # build. It was already flaking main intermittently (FuzzExtractHTTPHost is
      # the third and therefore most scheduling-pressured target). An iteration
      # budget carries no deadline, so that failure mode cannot occur.
      #
      # 1000000x preserves the coverage the 30s budget was buying — CI was
      # reaching ~1.45-1.65M execs per target in 30s — and is DETERMINISTIC:
      # every runner now does the same work, instead of fast runners fuzzing more
      # than slow ones. A real crasher still fails the build, which is the point.
      - name: go fuzz (short)
        working-directory: proxy
        run: |
          for t in FuzzExtractSNI FuzzParseServerName FuzzExtractHTTPHost; do
            echo "== fuzz $t =="
            go test -run='^$' -fuzz="^${t}$" -fuzztime=1000000x .
          done

      # HF-incident Issue 1: surface known vulnerabilities in the proxy's own
      # dependency + stdlib call paths. Advisory (continue-on-error): stdlib patch
      # latency is remediated by the proxy image's monthly golang-base refresh
      # (Issue 3) and miekg/dns bumps by Dependabot, so a new stdlib CVE surfaces
      # here without hard-breaking every unrelated proxy PR.
      - name: govulncheck (advisory)
        continue-on-error: true
        working-directory: proxy
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: static build
        working-directory: proxy
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/sandy-proxy .
