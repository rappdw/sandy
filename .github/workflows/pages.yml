# Publish docs/ to GitHub Pages.
#
# Replaces the legacy "deploy from branch" build, which cloned every
# submodule under research/ on each push (none of them is part of the
# site); one transient clone failure there failed a Pages build. docs/ is
# plain static HTML (.nojekyll), so it is uploaded as-is.
name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          sparse-checkout: docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
