name: Integration

# #106. The pure-script suite (.github/workflows/test.yml) runs on every PR.
# THIS suite builds real agent images, launches real containers, and makes real
# API calls — so it deliberately does NOT run on `pull_request`.
#
# Why not pull_request: GitHub does not pass secrets to forked-repo PRs, and we
# would not want it to. A keyed run triggered by an untrusted fork would hand
# an attacker our provider keys. Keyed runs therefore live on schedule and
# workflow_dispatch only, both of which run in the base-repo trust context.
on:
  schedule:
    # Mon-Sat 07:00 UTC: runs only if main moved in the last 24h (see the `gate`
    # job). Every keyed run costs real provider spend, and re-testing an
    # unchanged tree buys nothing.
    - cron: '0 7 * * 1-6'
    # Sunday 07:00 UTC: ALWAYS runs, even with no commits.
    #
    # This is not redundancy. Sandy installs the wrapped agents at
    # floating-latest (claude/codex/gemini/opencode via npm, grok via its
    # installer) and rebuilds on the per-launch update check -- so the suite can
    # break with ZERO repo changes, because upstream shipped a new agent
    # version. An activity-only gate would hide precisely the class of failure a
    # nightly exists to catch. The weekly baseline bounds how long that can hide
    # to seven days.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      skip:
        description: 'SANDY_INTEG_SKIP (comma-separated section ids). Default skips the three acceptance harnesses (~46% of runtime).'
        required: false
        default: '19,20,21'
      only:
        description: 'SANDY_INTEG_ONLY (comma-separated section ids). Empty runs everything not skipped. SKIP wins over ONLY.'
        required: false
        default: ''
      no_model_pin:
        description: 'Set to 1 to disable the Haiku model pin and run claude launches at sandy default model.'
        required: false
        default: ''

# `id-token: write` lets the job mint a GitHub OIDC token, which is exchanged for
# short-lived Anthropic API access (Workload Identity Federation, #190). Explicitly
# listing permissions also drops the default write-all token down to read-only for
# everything else.
permissions:
  contents: read
  id-token: write

# Never run two integration jobs at once: sections 19-21 manipulate host-wide
# daemon state (containers, networks, the workspace mutex), so concurrent runs
# would interfere. Do not cancel an in-progress run either — a half-torn-down
# fleet is worse than a queued job.
concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  # Decide whether to run at all, BEFORE spending a runner on checkout, disk
  # reclaim and image builds. Cheap: one API call, no checkout.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A human asked for this run explicitly. Never second-guess that.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — running regardless of activity"
            exit 0
          fi
          # The Sunday baseline always runs; see the cron comments above.
          if [ "${{ github.event.schedule }}" = "0 7 * * 0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "weekly baseline — running regardless of activity"
            exit 0
          fi
          _last="$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" \
                     --jq '.commit.committer.date')"
          _age=$(( ( $(date -u +%s) - $(date -u -d "$_last" +%s) ) / 3600 ))
          echo "last commit on ${{ github.ref_name }}: $_last (${_age}h ago)"
          if [ "$_age" -lt 24 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "main moved in the last 24h — running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no commits in 24h — skipping. Sunday's baseline run is unconditional."
          fi

  integration:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Full suite is ~27 min on the maintainer host and CI is slower; 90 gives
    # headroom without letting a hung section burn an hour of runner time.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Verify Docker
        run: docker info

      # The suite builds up to five agent images plus the base. A stock
      # ubuntu-latest runner has ~14 GB free, which is tight. Reclaim the
      # preinstalled toolchains we do not use before building anything.
      - name: Free runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          echo "after:"; df -h / | tail -1

      # Build BEFORE exchanging for a token. --build-only needs no credentials,
      # so it belongs outside the token window; the suite's own
      # ensure_image_built then no-ops. This still matters under the eager
      # per-section exchange below -- it is 3-6 minutes that would otherwise
      # eat into the first section's budget for no reason.
      - name: Pre-build agent images (outside the token window)
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: ./sandy --build-only

      # Workload Identity Federation (#190). Skipped entirely unless the rule ID
      # repository variable is set, so the API-key path below keeps working
      # untouched until this is proven out.
      #
      # The IDs are repository VARIABLES, not secrets: they are identifiers, and
      # a rule scoped to this repo means a leaked ID grants nothing. Only the
      # minted JWT and the exchanged access token are sensitive, and neither
      # leaves this job.
      #
      # EAGER, host-side exchange -- not the lazy in-container exchange this
      # workflow used before. Claude Code resolves credentials lazily (only
      # when it first needs them), so forwarding the raw identity token bound
      # the whole run to the GitHub JWT's measured ~300s lifetime, and two
      # sections individually exceed that on their own regardless of anything
      # cumulative. test/ci-wif-access-token.sh mints the JWT AND exchanges it
      # for an access token in one step, right here, so the budget that
      # matters becomes the ~598s access token instead -- see
      # docs/CI-KEYLESS-AUTH.md "Token lifetimes". The suite's own section()
      # hook (test/run-integration-tests.sh) re-runs this same script before
      # any section whose current token is >=60s old, so no section ever
      # starts on a stale one. Diagnostics (decoded JWT claims, the access
      # token's expires_in) are printed by the script itself, to stderr.
      - name: Exchange a federated Anthropic access token
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          _tok="$(bash test/ci-wif-access-token.sh)"
          if [ -z "$_tok" ]; then
            echo "::error::WIF exchange returned no access token"; exit 1
          fi
          echo "::add-mask::$_tok"
          echo "ANTHROPIC_AUTH_TOKEN=$_tok" >> "$GITHUB_ENV"

      - name: Run integration suite
        env:
          # Missing keys are NOT a failure: every keyed section probes for its
          # credential and skips cleanly (the suite has ~22 such skips). So this
          # workflow still yields signal on a fork-less repo with no secrets set.
          # WIF identifiers (repository variables; empty when not configured).
          # ANTHROPIC_WORKSPACE_ID is included even though the docs call it optional
          # for a single-workspace rule: the smoke test that PROVED this setup did
          # pass workspace_id, so whether it succeeded because of it is untested.
          # Setting it costs nothing and removes the question. These four stay in
          # this step's env regardless of WIF being active -- test/ci-wif-access-token.sh
          # reads them again on every per-section refresh (SANDY_INTEG_CRED_REFRESH_CMD,
          # WIF branch below), not just once at job start.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # On the nightly cron, `inputs` is empty, so these fall back to the
          # lean defaults rather than expanding to the empty string.
          SANDY_INTEG_SKIP: ${{ github.event.inputs.skip || '19,20,21' }}
          SANDY_INTEG_ONLY: ${{ github.event.inputs.only || '' }}
          SANDY_INTEG_NO_MODEL_PIN: ${{ github.event.inputs.no_model_pin || '' }}
          # CI runners are slower than the maintainer host; the default 300s
          # per-test timeout is tuned for the latter.
          SANDY_INTEG_TIMEOUT: '600'
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_FEDERATION_RULE_ID:-}" ]; then
            # ANTHROPIC_API_KEY outranks ANTHROPIC_AUTH_TOKEN in the client's
            # credential resolution EVEN WHEN SET TO THE EMPTY STRING. Actions
            # cannot conditionally omit an `env:` entry -- a conditional
            # expression yields '', which still counts as set -- so it must be
            # `unset` here, in the shell that launches the suite. Leaving it
            # blank would silently fall back to ANTHROPIC_API_KEY (empty ->
            # "no credentials") instead of using the federated token.
            #
            # ANTHROPIC_AUTH_TOKEN is deliberately NOT unset -- it is the
            # credential this path forwards, set above (via GITHUB_ENV) by the
            # "Exchange a federated Anthropic access token" step.
            unset ANTHROPIC_API_KEY
            echo "auth: workload identity federation (rule ${ANTHROPIC_FEDERATION_RULE_ID})"
            # Sandy only forwards env vars it recognizes, and ANTHROPIC_AUTH_TOKEN
            # is not a sandy config key -- name it explicitly. Scoped to this
            # branch (not the job's `env:` block above) so the API-key path
            # below is byte-identical to before this change: no
            # SANDY_EXTRA_ENV, no refresh hook, nothing WIF-shaped at all.
            export SANDY_EXTRA_ENV=ANTHROPIC_AUTH_TOKEN
            # Re-exchange before any section whose current token is >=60s old
            # (test/run-integration-tests.sh's section() hook). This is what
            # fixes the budget being the JWT's ~300s instead of the access
            # token's ~598s -- see docs/CI-KEYLESS-AUTH.md "Token lifetimes".
            export SANDY_INTEG_CRED_REFRESH_CMD='bash test/ci-wif-access-token.sh'
          else
            echo "auth: ANTHROPIC_API_KEY secret (WIF not configured)"
          fi
          bash test/run-integration-tests.sh

      # Runs even on failure: a failed section often leaves containers or
      # networks behind, and the runner is ephemeral anyway — but printing what
      # leaked is the diagnostic the maintainer actually wants from a red run.
      - name: Post-run resource report
        if: always()
        run: |
          echo "== containers =="; docker ps -a --filter 'name=sandy' || true
          echo "== networks ==";   docker network ls --filter 'name=sandy' || true
          echo "== disk ==";       df -h / | tail -1
